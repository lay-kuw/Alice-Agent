<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Alice</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<script src="/app.js" defer></script>
<script src="/google.js" defer></script>
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card glass">
    <img src="/icon.png" alt="" class="login-icon">
    <h1 class="logo">Alice</h1>
    <p class="muted" data-i18n="login.hint"></p>
    <input id="login-token" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary" data-i18n="login.submit"></button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden view-chat">
  <nav id="rail" class="rail" aria-label="Views">
    <img src="/icon.png" alt="Alice" class="rail-icon">
    <button data-view="chat" class="on" data-i18n-title="v.chat"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5z"/></svg><span data-i18n="v.chat"></span></button>
    <button data-view="calendar" data-i18n-title="v.calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-i18n="v.calendar"></span></button>
    <button data-view="mail" data-i18n-title="v.mail"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg><span data-i18n="v.mail"></span><b id="unread-badge" class="rail-badge hidden"></b></button>
    <button data-view="tasks" data-i18n-title="v.tasks"><svg viewBox="0 0 24 24"><path d="m4 6.5 1.8 1.8L9 5M4 13.5l1.8 1.8L9 12"/><path d="M12.5 7h7.5M12.5 14h7.5M4.5 19.5h15"/></svg><span data-i18n="v.tasks"></span></button>
    <button data-view="agents" data-i18n-title="v.agents"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.2l2.6 1.6M9.5 2.8h5M18.5 6.5l1.5-1.5"/></svg><span data-i18n="v.agents"></span></button>
    <span class="rail-gap"></span>
    <button id="open-settings" class="rail-settings" data-i18n-title="settings.title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span data-i18n="settings.title"></span></button>
    <span id="conn" class="conn" title=""></span>
  </nav>
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="brand"><span class="logo">Alice</span><span id="profile-tag" class="profile-tag"></span></div>
      <button id="new-chat" class="primary wide" data-i18n="newChat"></button>
    </div>
    <nav id="threads" class="threads" aria-label="Threads"></nav>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main id="view-chat" class="main">
    <header class="top">
      <button id="toggle-side" class="ghost icon" aria-label="Threads">☰</button>
      <span class="conn conn-top"></span>
      <div id="thread-title" class="title"></div>
      <select id="model-select" aria-label="Model"></select>
      <select id="effort-select" aria-label="Reasoning" hidden></select>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty"><img src="/icon.png" alt="" class="empty-icon"></div>
    </section>

    <form id="composer" class="composer">
      <div id="slash" class="slash hidden" role="listbox"></div>
      <div id="attach-list" class="attach-list"></div>
      <div class="composer-row">
        <label class="attach" data-i18n-title="attach">＋<input id="file-input" type="file" multiple hidden></label>
        <textarea id="input" rows="1" autocomplete="off"></textarea>
        <button id="send" type="submit" class="primary icon" aria-label="Send">↑</button>
        <button id="stop" type="button" class="icon hidden" aria-label="Stop">■</button>
      </div>
    </form>
  </main>
  <main id="view-calendar" class="main gview hidden"></main>
  <main id="view-mail" class="main gview hidden"></main>
  <main id="view-tasks" class="main gview hidden"></main>
  <main id="view-agents" class="main gview hidden"></main>
</div>

<div id="settings" class="settings hidden" role="dialog" aria-modal="true">
  <div class="settings-panel">
    <header class="settings-head">
      <h2 data-i18n="settings.title"></h2>
      <button id="close-settings" class="ghost icon" aria-label="Close">✕</button>
    </header>
    <div class="settings-body">
      <nav id="settings-tabs" class="tabs">
        <button data-tab="general" class="active" data-i18n="tab.general"></button>
        <button data-tab="soul" data-i18n="tab.soul"></button>
        <button data-tab="models" data-i18n="tab.models"></button>
        <button data-tab="channels" data-i18n="tab.channels"></button>
        <button data-tab="tools" data-i18n="tab.tools"></button>
        <button data-tab="memory" data-i18n="tab.memory"></button>
        <button data-tab="system" data-i18n="tab.system"></button>
      </nav>
      <div id="settings-content" class="settings-content"></div>
    </div>
  </div>
</div>
<div id="thread-pop" class="menu hidden" role="menu">
  <button data-act="rename" data-i18n="rename"></button>
  <button data-act="delete" class="danger" data-i18n="deleteThread"></button>
</div>
<div id="modal" class="settings hidden" role="dialog" aria-modal="true">
  <div class="modal-panel">
    <header class="settings-head">
      <h2 id="modal-title"></h2>
      <button id="close-modal" class="ghost icon" aria-label="Close">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>
<div id="gmenu" class="menu hidden" role="menu"></div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
