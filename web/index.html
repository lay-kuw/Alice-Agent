<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Alice</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card">
    <h1>Alice</h1>
    <p class="muted">Enter the API token shown by <code>alice token</code>.</p>
    <input id="login-token" type="password" autocomplete="current-password" placeholder="API token" required>
    <button type="submit" class="primary">Sign in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <button id="new-chat" class="primary wide">＋ New chat</button>
    </div>
    <nav id="threads" class="threads" aria-label="Threads"></nav>
    <div class="side-foot">
      <button id="open-settings" class="ghost wide">⚙ Settings</button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main class="main">
    <header class="top">
      <button id="toggle-side" class="ghost icon" aria-label="Threads">☰</button>
      <div id="thread-title" class="title" title="Rename">New chat</div>
      <select id="model-select" aria-label="Model"></select>
      <button id="thread-menu" class="ghost icon" aria-label="Thread actions">⋯</button>
    </header>
    <div id="menu" class="menu hidden">
      <button data-act="rename">Rename</button>
      <button data-act="delete" class="danger">Delete thread</button>
    </div>

    <section id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <h2>How can I help?</h2>
        <p class="muted">Threads, memory and settings are shared with the CLI, iPhone, Telegram and Discord.</p>
      </div>
    </section>

    <form id="composer" class="composer">
      <div id="attach-list" class="attach-list"></div>
      <div class="composer-row">
        <label class="ghost icon attach" title="Attach files">📎<input id="file-input" type="file" multiple hidden></label>
        <textarea id="input" rows="1" placeholder="Message Alice…" autocomplete="off"></textarea>
        <button id="send" type="submit" class="primary icon" aria-label="Send">↑</button>
        <button id="stop" type="button" class="icon hidden" aria-label="Stop">■</button>
      </div>
    </form>
  </main>
</div>

<div id="settings" class="settings hidden" role="dialog" aria-modal="true">
  <div class="settings-panel">
    <header class="settings-head">
      <h2>Settings</h2>
      <button id="close-settings" class="ghost icon" aria-label="Close">✕</button>
    </header>
    <div class="settings-body">
      <nav id="settings-tabs" class="tabs">
        <button data-tab="general" class="active">General</button>
        <button data-tab="models">Models</button>
        <button data-tab="channels">Channels</button>
        <button data-tab="tools">Tools</button>
        <button data-tab="memory">Memory</button>
        <button data-tab="system">System</button>
      </nav>
      <div id="settings-content" class="settings-content"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
