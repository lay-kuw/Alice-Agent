[package]
name = "alice"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "original-uri", "form"] }
clap = { version = "4.6.9", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "query", "form"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "io-std", "fs", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.20"
toml = "1.2.2"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "alice"
path = "src/lib.rs"

[[bin]]
name = "alice"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
